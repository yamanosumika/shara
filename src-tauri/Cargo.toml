[package]
name = "shara"
version = "0.1.0"
description = "SHARA local graph design tool"
license = "Apache-2.0"
authors = ["yamanosumika"]
edition = "2021"

[lib]
name = "shara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
